[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmap-convert"
dynamic = ["version"]
description = "Convert Cartesian electromagnetic field tables to G4beamline BLFieldMap files"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}
authors = [{name = "Eremey Valetov"}]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]

[project.scripts]
fieldmap-convert = "fieldmap_convert.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fieldmap_convert.__version__"}

[tool.setuptools.packages.find]
include = ["fieldmap_convert*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
